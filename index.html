<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Counter App</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }

    .card {
      padding: 20px;
      text-align: center;
      width: 600px;
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 8px;
    }

    h2 {
      color: white;
      font-size: 25px;
      text-transform: uppercase;
      font-weight: 800;
    }

    p {
      color: white;
      font-size: 25px;
    }

    button {
      width: 100px;
      height: 40px;
      font-size: 18px;
      font-weight: 700;
      background: none;
      color: white;
      border: 2px solid white;
      cursor: pointer;
      margin: 4px;
    }

    button:hover {
      box-shadow: 0 0 20px whitesmoke;
    }

    button:active {
      color: blue;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Counter</h2>
    <p id="count" style="font-size: 40px;">0</p>

    <button onclick="increaseCount()">+</button>
    <button onclick="decreaseCount()">-</button>
    <button onclick="resetCount()">Reset</button>
    <button onclick="saveCount()">Save</button>
    <button onclick="loadCount()">Load</button>
  </div>

  <script>
    let count = 0;

    function updateCount() {
      document.getElementById("count").innerHTML = count;
    }

    function increaseCount() {
      count++;
      updateCount();
    }

    function decreaseCount() {
      count--;
      updateCount();
    }

    function resetCount() {
      count = 0;
      updateCount();
    }

    function saveCount() {
      localStorage.setItem("count", count);
    }

    function loadCount() {
      let saved = localStorage.getItem("count");
      if (saved !== null) {
        count = Number(saved);
      }
      updateCount();
    }
  </script>
</body>
</html>
